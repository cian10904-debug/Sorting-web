<!DOCTYPE html >

<html lang="en" >

<head >

<meta charset="UTF-8" >

<title >Sorting Website</title >

<link rel="stylesheet" href="style.css" >

</head >

<body>
<div>
<h1>Sorting</h1>
</div>
<div>
    <h2>Sort by:</h2>
    <button>
        <h3 id="t">Text</h3>
    </button>
    <button>
        <h3 id="n">Numerical</h3>
    </button>
    <button>
        <h3 id="ad">Ascending/Descending</h3>
    </button>
    <p id="ads"></p> <!--ascending or descending stats-->
</div>
<div>
    <label for="message">Input values:</label><button>Enter values</button>
</div>
<input id="message" type="text" placeholder="Type values here"></input>

</body>

</html >
