<!DOCTYPE html >

<html lang="en" >

<head >

<meta charset="UTF-8" >

<title >Sorting Website</title >

<link rel="stylesheet" href="style.css" >

</head >

<body >
<div>
<h1>Sorting</h1>
</div>
<div>
    <h2>Sort by:</h2>
    <button>
        <h3>Text</h3>
    </button>
    <button>
        <h3>Numerical</h3>
    </button>
    <button>
        <h3>Ascending/Descending</h3>
    </button>
</div>


<div>
    <label for="message">Input values:</label><button>Enter values</button>
</div>
<div>
<textarea id="message" name="message" rows="4" cols="50" placeholder="Type values to sort here"></textarea>
</div>
<div>
    <p id='text'>Your sorted list will be here</p>
</div>
</body >

</html >
